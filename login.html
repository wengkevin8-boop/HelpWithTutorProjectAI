<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign In — HelpWithTutor</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Oswald:wght@300;400;500;600&display=swap" rel="stylesheet">

  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/lucide@latest"></script>

  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/auth.css">
</head>

<body class="bg-[#050505] text-white font-[Inter] min-h-screen flex items-center justify-center px-4">

  <!-- Background Glow -->
  <div class="fixed top-0 left-1/2 -translate-x-1/2 w-[600px] h-[600px] bg-[#E30613] rounded-full opacity-[0.03] blur-[150px] pointer-events-none"></div>

  <main class="w-full max-w-md relative">

    <!-- Logo -->
    <a href="/" class="flex items-center justify-center gap-3 mb-10">
      <div class="w-10 h-10 rounded-xl bg-[#E30613] flex items-center justify-center">
        <i data-lucide="graduation-cap" class="w-5 h-5 text-white"></i>
      </div>
      <span class="font-[Oswald] text-xl tracking-wide">
        HELP<span class="text-[#E30613]">WITH</span>TUTOR
      </span>
    </a>

    <!-- Card -->
    <section class="bg-[#0a0a0a] border border-white/5 rounded-2xl p-8">

      <h1 class="font-[Oswald] text-2xl text-center mb-2">WELCOME BACK</h1>
      <p class="text-sm text-gray-500 text-center mb-8">Sign in to access your tutoring plans</p>

      <!-- Form — no action/method, handled by fetch -->
      <form id="login-form" class="space-y-5" novalidate>

        <!-- Email -->
        <div>
          <label for="email" class="block text-xs uppercase tracking-widest text-gray-400 mb-2">Email</label>
          <div class="relative">
            <i data-lucide="mail" class="absolute left-3.5 top-1/2 -translate-y-1/2 w-4 h-4 text-gray-500 pointer-events-none"></i>
            <input
              id="email"
              name="email"
              type="email"
              required
              autocomplete="email"
              placeholder="you@example.com"
              class="auth-input w-full pl-11 pr-4 py-3 bg-[#1a1a1a] border border-white/10 rounded-lg text-sm placeholder-gray-600 focus:outline-none focus:border-[#E30613] transition-colors duration-200"
            >
          </div>
          <p id="email-error" class="hidden text-xs text-[#E30613] mt-1"></p>
        </div>

        <!-- Password -->
        <div>
          <label for="password" class="block text-xs uppercase tracking-widest text-gray-400 mb-2">Password</label>
          <div class="relative">
            <i data-lucide="lock" class="absolute left-3.5 top-1/2 -translate-y-1/2 w-4 h-4 text-gray-500 pointer-events-none"></i>
            <input
              id="password"
              name="password"
              type="password"
              required
              autocomplete="current-password"
              placeholder="Enter your password"
              class="auth-input w-full pl-11 pr-11 py-3 bg-[#1a1a1a] border border-white/10 rounded-lg text-sm placeholder-gray-600 focus:outline-none focus:border-[#E30613] transition-colors duration-200"
            >
            <button
              type="button"
              id="toggle-pwd"
              aria-label="Show password"
              class="absolute right-3.5 top-1/2 -translate-y-1/2 text-gray-500 hover:text-gray-300 transition-colors"
            >
              <i data-lucide="eye" class="w-4 h-4" id="eye-icon"></i>
            </button>
          </div>
          <p id="password-error" class="hidden text-xs text-[#E30613] mt-1"></p>
        </div>

        <!-- General Error -->
        <div id="general-error" class="hidden text-sm text-[#E30613] bg-[#E30613]/10 border border-[#E30613]/20 rounded-lg px-4 py-3"></div>

        <!-- Submit -->
        <button
          id="submit-btn"
          type="submit"
          class="w-full py-3.5 bg-[#E30613] hover:bg-[#b91c1c] rounded-lg uppercase tracking-widest text-sm font-medium flex justify-center items-center gap-2 transition-colors duration-300 disabled:opacity-50 disabled:cursor-not-allowed"
        >
          <span id="btn-text">Sign In</span>
          <svg id="btn-spinner" class="hidden animate-spin h-4 w-4" viewBox="0 0 24 24" aria-hidden="true">
            <circle cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4" fill="none" class="opacity-25"></circle>
            <path fill="currentColor" class="opacity-75" d="M4 12a8 8 0 018-8V0A12 12 0 000 12h4z"></path>
          </svg>
        </button>
      </form>

      <!-- Divider -->
      <div class="flex items-center gap-4 my-6">
        <div class="flex-1 h-px bg-white/10"></div>
        <span class="text-xs text-gray-600">OR</span>
        <div class="flex-1 h-px bg-white/10"></div>
      </div>

      <!-- Sign Up Link -->
      <p class="text-center text-sm text-gray-400">
        Don't have an account?
        <a href="/signup" class="text-[#E30613] hover:underline font-medium">Create one</a>
      </p>
    </section>

    <!-- Back to Home -->
    <a href="/" class="flex items-center justify-center gap-2 mt-6 text-xs text-gray-500 hover:text-gray-300 transition-colors">
      <i data-lucide="arrow-left" class="w-3 h-3"></i>
      Back to home
    </a>
  </main>

  <!-- Toast Container -->
  <div id="toast-container" class="fixed bottom-6 right-6 z-50 space-y-3"></div>

  <script>
    // ── Init Icons ────────────────────────────────
    lucide.createIcons();

    // ── DOM References ────────────────────────────
    var form = document.getElementById('login-form');
    var emailInput = document.getElementById('email');
    var passwordInput = document.getElementById('password');
    var emailError = document.getElementById('email-error');
    var passwordError = document.getElementById('password-error');
    var generalError = document.getElementById('general-error');
    var submitBtn = document.getElementById('submit-btn');
    var btnText = document.getElementById('btn-text');
    var btnSpinner = document.getElementById('btn-spinner');
    var togglePwd = document.getElementById('toggle-pwd');
    var eyeIcon = document.getElementById('eye-icon');
    var passwordVisible = false;

    emailInput.addEventListener('input', function () {
      emailInput.classList.remove('input-error');
      emailError.classList.add('hidden');
      emailError.textContent = '';
      generalError.classList.add('hidden');
    });

    passwordInput.addEventListener('input', function () {
      passwordInput.classList.remove('input-error');
      passwordError.classList.add('hidden');
      passwordError.textContent = '';
      generalError.classList.add('hidden');
    });

    togglePwd.addEventListener('click', function () {
      passwordVisible = !passwordVisible;
      passwordInput.type = passwordVisible ? 'text' : 'password';
      // Swap the icon
      eyeIcon.setAttribute('data-lucide', passwordVisible ? 'eye-off' : 'eye');
      lucide.createIcons();
      togglePwd.setAttribute('aria-label', passwordVisible ? 'Hide password' : 'Show password');
    });

    function showFieldError(input, errorEl, message) {
      input.classList.add('input-error');
      errorEl.textContent = message;
      errorEl.classList.remove('hidden');
    }

    function showGeneralError(message) {
      generalError.textContent = message;
      generalError.classList.remove('hidden');
    }

    function setLoading(loading) {
      submitBtn.disabled = loading;
      btnText.textContent = loading ? 'Signing in...' : 'Sign In';
      btnSpinner.classList.toggle('hidden', !loading);
    }

    form.addEventListener('submit', async function (e) {
      e.preventDefault();

      // Hide all previous errors
      emailError.classList.add('hidden');
      passwordError.classList.add('hidden');
      generalError.classList.add('hidden');
      emailInput.classList.remove('input-error');
      passwordInput.classList.remove('input-error');

      var email = emailInput.value.trim();
      var password = passwordInput.value;
      var hasError = false;

      if (!email) {
        showFieldError(emailInput, emailError, 'Email is required.');
        hasError = true;
      } else if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) {
        showFieldError(emailInput, emailError, 'Please enter a valid email address.');
        hasError = true;
      }

      if (!password) {
        showFieldError(passwordInput, passwordError, 'Password is required.');
        hasError = true;
      }

      if (hasError) return;

      setLoading(true);

      try {
        var res = await fetch('/api/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ email: email, password: password })
        });

        var data = await res.json();

        if (!data.success) {
          // Determine which field to show the error on
          var msg = data.message || 'Sign in failed.';
          if (msg.toLowerCase().includes('email') || msg.toLowerCase().includes('invalid')) {
            // Show on both fields for invalid credentials — user shouldn't know which is wrong
            showGeneralError(msg);
          } else {
            showGeneralError(msg);
          }
          setLoading(false);
          return;
        }

        // Success — redirect to dashboard
        window.location.href = '/dashboard';
      } catch (err) {
        showGeneralError('Network error. Please check your connection and try again.');
        setLoading(false);
      }
    });

    function showToast(message, type) {
      type = type || 'info';
      var container = document.getElementById('toast-container');
      var toast = document.createElement('div');
      var bgColors = {
        success: 'background:#16a34a',
        error: 'background:#E30613',
        info: 'background:#374151'
      };
      toast.setAttribute('style', (bgColors[type] || bgColors.info) + '; color:#fff; font-size:0.875rem; padding:0.75rem 1.25rem; border-radius:0.5rem; box-shadow:0 10px 15px -3px rgba(0,0,0,0.3); transform:translateX(120%); transition:transform 0.3s ease; white-space:nowrap;');
      toast.textContent = message;
      container.appendChild(toast);

      requestAnimationFrame(function () {
        toast.style.transform = 'translateX(0)';
      });

      setTimeout(function () {
        toast.style.transform = 'translateX(120%)';
        setTimeout(function () {
          if (toast.parentNode) toast.parentNode.removeChild(toast);
        }, 300);
      }, 4000);
    }
  </script>
</body>
</html>
